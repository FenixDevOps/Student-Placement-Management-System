# Spring Application Config
spring.application.name=system
server.port=8081

# Database Configuration (PostgreSQL in Production, H2 locally)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:placement_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# Enable H2 Database Console at /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Auto run SQL files on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# PostgreSQL Datasource Configuration (Commented out for zero-install run)
# spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:placement_db}
# spring.datasource.username=${DB_USER:postgres}
# # spring.datasource.password=${DB_PASSWORD:postgres}
# # spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT Configuration
jwt.secret=9a2f96e4404e4a78b548b8163f912cd3ef688b56fca554ffbd32d4b96191b2bf
# Token validity: 1 day in milliseconds (86400000)
jwt.expiration=86400000

# AWS S3 Settings (Fallbacks to local storage if credentials are empty)
aws.s3.bucket-name=${AWS_S3_BUCKET:}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.access-key=${AWS_ACCESS_KEY_ID:}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# Local storage fallback directory for resumes
upload.local-dir=./uploads/resumes

# Mail Settings (Console output fallback is implemented in EmailService if credentials are default)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Swagger / OpenAPI Settings
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Enable file size limits for PDF resumes (Max 5MB)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
