services:
  - type: web
    name: placement-backend
    env: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: PORT
        value: "8081"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_SQL_INIT_MODE
        value: never
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${placement-db.HOST}:${placement-db.PORT}/${placement-db.DATABASE}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: placement-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: placement-db
          property: password
      - key: SPRING_JPA_DATABASE_PLATFORM
        value: org.hibernate.dialect.PostgreSQLDialect
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: FRONTEND_URL
        value: "https://your-vercel-domain.vercel.app" # UPDATE THIS AFTER VERCEL DEPLOYMENT

databases:
  - name: placement-db
    databaseName: placement_db
    user: postgres
    region: oregon
    plan: free
